services:
  janus:
    build: .
    image: janus:latest
    command: ["serve", "--output-root", "/data/out", "--host", "0.0.0.0", "--port", "8000"]
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./Config:/config:ro
      - ./out:/data/out
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
